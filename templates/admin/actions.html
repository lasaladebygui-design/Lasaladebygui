{% load i18n jazzmin %}
{% get_jazzmin_ui_tweaks as jazzmin_ui %}

{# Botones en vez de desplegable: mismo mecanismo de Django por debajo (el
   <select> sigue ahí, solo oculto) — cada botón le pone su valor y dispara
   el envío, así no hace falta reescribir nada del lado del servidor. Los
   botones solo se ven cuando hay algo seleccionado: antes de eso no hay
   nada que hacer con ellos. #}
<style>
    .admin-action-buttons-wrap { display: none; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-right: 0.8rem; }
    .admin-action-buttons-wrap--visible { display: inline-flex; }
</style>
<div class="actions">
    {% block actions %}
        {% block actions-form %}
            {% for field in action_form %}
                {% if field.name == "action" %}
                    <div class="admin-action-buttons-wrap" id="admin-action-buttons-wrap">
                        <span class="muted" style="margin-right:0.3rem;">Con los seleccionados:</span>
                        {% for value, label in field.field.choices %}
                            {% if value %}
                            <button type="button" class="btn btn-sm {{ jazzmin_ui.button_classes.secondary }} admin-action-buttons__btn" data-action-value="{{ value }}">{{ label }}</button>
                            {% endif %}
                        {% endfor %}
                    </div>
                    <span style="display:none;">{{ field }}</span>
                {% else %}
                    <label style="display:none;">{{ field }}</label>
                {% endif %}
            {% endfor %}
        {% endblock %}
        {% block actions-submit %}
            <button type="submit" id="admin-action-go" style="display:none;" name="index" value="{{ action_index|default:0 }}">{% trans "Go" %}</button>
        {% endblock %}
        {% block actions-counter %}
            {% if actions_selection_counter %}
                <span class="action-counter" data-actions-icnt="{{ cl.result_list|length }}">{{ selection_note }}</span>
                {% if cl.result_count != cl.result_list|length %}
                    <span class="all hidden">{{ selection_note_all }}</span>
                    <span class="question hidden">
                        <a href="#" title="{% trans "Click here to select the objects across all pages" %}">
                            {% blocktrans with cl.result_count as total_count %}Select all {{ total_count }} {{ module_name }}{% endblocktrans %}
                        </a>
                    </span>
                    <span class="clear" style="display: none;"><a href="#">{% trans "Clear selection" %}</a></span>
                {% endif %}
            {% endif %}
        {% endblock %}
    {% endblock %}
</div>
<script>
(function () {
    function refresh() {
        var form = document.getElementById("changelist-form");
        var wrap = document.getElementById("admin-action-buttons-wrap");
        if (!form || !wrap) return;
        var any = form.querySelectorAll('input[name="_selected_action"]:checked').length > 0;
        wrap.classList.toggle("admin-action-buttons-wrap--visible", any);
    }

    document.addEventListener("DOMContentLoaded", refresh);
    // "setTimeout 0" para leer el estado de las casillas ya actualizado,
    // tanto si el clic fue en una fila como en "seleccionar todas".
    document.addEventListener("click", function (event) {
        if (event.target.closest("#action-toggle")) setTimeout(refresh, 0);
    });
    document.addEventListener("change", function (event) {
        if (event.target.matches('input[name="_selected_action"]')) setTimeout(refresh, 0);
    });

    document.addEventListener("click", function (event) {
        var btn = event.target.closest(".admin-action-buttons__btn");
        if (!btn) return;
        var form = btn.closest("form");
        form.querySelector('select[name="action"]').value = btn.dataset.actionValue;
        document.getElementById("admin-action-go").click();
    });
})();
</script>
