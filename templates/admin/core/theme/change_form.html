{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}
<div style="margin: 1.5rem 0;">
    <h2>Vista previa</h2>
    <p class="help">Se actualiza sola según cambias los colores, tipografías o formas de arriba — no hace falta guardar para verla.</p>

            style="width:100%; max-width:900px; height:520px; border:1px solid #ccc; border-radius:6px;"></iframe>
</div>
{% endblock %}
