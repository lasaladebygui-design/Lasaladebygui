{% if editable %}
<div class="favorite-card__tools">
    <span class="drag-handle" title="Arrastra para reordenar">⠿</span>
    <form method="post" action="{% url 'accounts:favorite-move' pk=fav.pk direction='up' %}">
        {% csrf_token %}
        <button type="submit" class="link-btn" title="Mover antes" {% if forloop.first %}disabled{% endif %}>◀</button>
    </form>
    <form method="post" action="{% url 'accounts:favorite-remove' pk=fav.pk %}">
        {% csrf_token %}
        <button type="submit" class="link-btn link-btn--danger" title="Quitar">✕</button>
    </form>
    <form method="post" action="{% url 'accounts:favorite-move' pk=fav.pk direction='down' %}">
        {% csrf_token %}
        <button type="submit" class="link-btn" title="Mover después" {% if forloop.last %}disabled{% endif %}>▶</button>
    </form>
</div>
{% endif %}
