{% if editable %}
<div class="favorite-card__tools">
    <form method="post" action="{% url 'accounts:favorite-move' pk=fav.pk direction='up' %}">
        {% csrf_token %}
        <button type="submit" class="link-btn" title="Mover antes" {% if forloop.first %}disabled{% endif %}>◀</button>
    </form>
    <form method="post" action="{% url 'accounts:favorite-remove' pk=fav.pk %}">
        {% csrf_token %}
        <button type="submit" class="link-btn link-btn--danger" title="Quitar">✕</button>
    </form>
    <form method="post" action="{% url 'accounts:favorite-move' pk=fav.pk direction='down' %}">
        {% csrf_token %}
        <button type="submit" class="link-btn" title="Mover después" {% if forloop.last %}disabled{% endif %}>▶</button>
    </form>
</div>
{% endif %}

{% if category == "suggested" %}
    {% if fav.note %}<p class="favorite-card__note">💬 {{ fav.note }}</p>{% endif %}
    {% if editable %}
    <details class="favorite-card__note-edit">
        <summary class="link-btn">{% if fav.note %}Editar por qué{% else %}+ Explicar por qué{% endif %}</summary>
        <form method="post" action="{% url 'accounts:favorite-note' pk=fav.pk %}">
            {% csrf_token %}
            <textarea name="note" maxlength="280" placeholder="¿Por qué la recomiendas?">{{ fav.note }}</textarea>
            <button type="submit" class="btn btn--accent btn--sm">Guardar</button>
        </form>
    </details>
    {% endif %}
{% endif %}
