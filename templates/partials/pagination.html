{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Paginación">
    {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="btn btn--ghost btn--sm">&larr; Anterior</a>
    {% endif %}
    <span class="pagination__status muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="btn btn--ghost btn--sm">Siguiente &rarr;</a>
    {% endif %}
</nav>
{% endif %}
