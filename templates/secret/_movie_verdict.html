{% load secret_extras %}
<div class="secret-verdict" id="verdict-{{ movie.pk }}">
    <span class="secret-verdict__label">Evaluación real</span>
    <div class="secret-verdict__options">
        <button type="button"
                class="secret-verdict__btn{% if movie.rating_verdict == "sobrevalorada" %} secret-verdict__btn--active{% endif %}"
                hx-post="{% url 'secret:set-movie-verdict' movie.pk %}"
                hx-vals='{"verdict": "{% if movie.rating_verdict == "sobrevalorada" %}{% else %}sobrevalorada{% endif %}"}'
                hx-target="#verdict-{{ movie.pk }}" hx-swap="outerHTML">
            <span aria-hidden="true">↑</span> Sobrevalorada
        </button>
        <button type="button"
                class="secret-verdict__btn{% if movie.rating_verdict == "bien_valorada" %} secret-verdict__btn--active{% endif %}"
                hx-post="{% url 'secret:set-movie-verdict' movie.pk %}"
                hx-vals='{"verdict": "{% if movie.rating_verdict == "bien_valorada" %}{% else %}bien_valorada{% endif %}"}'
                hx-target="#verdict-{{ movie.pk }}" hx-swap="outerHTML">
            <span aria-hidden="true">=</span> Bien valorada
        </button>
        <button type="button"
                class="secret-verdict__btn{% if movie.rating_verdict == "infravalorada" %} secret-verdict__btn--active{% endif %}"
                hx-post="{% url 'secret:set-movie-verdict' movie.pk %}"
                hx-vals='{"verdict": "{% if movie.rating_verdict == "infravalorada" %}{% else %}infravalorada{% endif %}"}'
                hx-target="#verdict-{{ movie.pk }}" hx-swap="outerHTML">
            <span aria-hidden="true">↓</span> Infravalorada
        </button>
    </div>
</div>
