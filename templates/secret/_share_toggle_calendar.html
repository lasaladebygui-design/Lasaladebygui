{% if member %}
<form method="post" action="{% url 'secret:calendar-share-kick' member.pk %}" class="inline-form"
      hx-post="{% url 'secret:calendar-share-kick' member.pk %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}<button type="submit" class="share-toggle share-toggle--on" title="Quitar acceso a tu calendario">📅 Calendario ✓</button>
</form>
{% else %}
<form method="post" action="{% url 'secret:calendar-share-invite' friend.username %}" class="inline-form"
      hx-post="{% url 'secret:calendar-share-invite' friend.username %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}<button type="submit" class="share-toggle" title="Compartir tu calendario">📅 Calendario</button>
</form>
{% endif %}
