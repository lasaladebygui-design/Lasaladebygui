<div class="movie-detail__poster-wrap">
    {% if movie.poster_url %}
        <img src="{{ movie.poster_url }}" alt="" class="movie-detail__poster">
    {% else %}
        <div class="movie-detail__poster movie-card__poster--placeholder"><span>🎬</span></div>
    {% endif %}
    {% if movie.movie.is_tv %}
    <button type="button"
            class="secret-movie__watch-badge secret-movie__watch-badge--{{ movie.series_watch_status|default:'not_watched' }}"
            title="{% if movie.series_watch_status == 'watched' %}Vista — clic para cambiar{% elif movie.series_watch_status == 'airing' %}En emisión — clic para cambiar{% else %}No vista — clic para cambiar{% endif %}"
            hx-post="{% url 'secret:movie-watch-cycle' movie.pk %}?context=detail"
            hx-target="closest .movie-detail__poster-wrap"
            hx-swap="outerHTML"
    ></button>
    {% endif %}
</div>
