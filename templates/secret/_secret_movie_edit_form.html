{% load l10n %}
{% if editable %}
<button type="button" class="link-btn secret-movie__edit-toggle" @click.stop="editing = !editing">
    <span x-text="editing ? 'Cerrar edición' : '✏️ Editar título, nota, comentario, listas y portada'">✏️ Editar título, nota, comentario, listas y portada</span>
</button>
<form method="post" action="{% url 'secret:movie-quick-edit' movie.pk %}" class="secret-movie__edit-form" x-show="editing" x-cloak @click.stop>
    {% csrf_token %}
    <input type="hidden" name="scope" value="{{ scope }}">
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="field">
        <label for="title-{{ movie.pk }}">Título</label>
        <input type="text" name="title" id="title-{{ movie.pk }}" value="{{ movie.title }}">
    </div>
    <div class="field">
        <label for="rating-{{ movie.pk }}">Nota</label>
        <input type="number" name="personal_rating" id="rating-{{ movie.pk }}" step="0.1" min="1" max="10" value="{{ movie.personal_rating|unlocalize }}">
    </div>
    <div class="field">
        <label for="tiebreak-{{ movie.pk }}">Desempate</label>
        <input type="number" name="tie_break" id="tiebreak-{{ movie.pk }}" min="0" value="{{ movie.tie_break|unlocalize }}">
    </div>
    <div class="field">
        <label for="comment-{{ movie.pk }}">Comentario</label>
        <textarea name="comment" id="comment-{{ movie.pk }}" rows="4">{{ movie.comment }}</textarea>
    </div>
    <div class="field">
        <label>Listas</label>
        <div class="checkbox-grid">
            {% for genre in all_genres %}
            <label class="checkbox-grid__item">
                <input type="checkbox" name="genres" value="{{ genre.pk }}" {% if genre in movie.genres.all %}checked{% endif %}>
                {{ genre.name }}
            </label>
            {% empty %}
            <span class="muted">Todavía no hay listas — <a href="{% url 'secret:genre-manage' %}?scope={{ scope }}">créalas aquí</a>.</span>
            {% endfor %}
        </div>
    </div>
    <div class="field">
        <label for="newgenres-{{ movie.pk }}">Listas nuevas</label>
        <input type="text" name="new_genres_input" id="newgenres-{{ movie.pk }}" placeholder="Sepáralas con comas">
    </div>
    <button type="submit" class="btn btn--accent btn--sm">Guardar</button>
</form>
<div class="secret-movie__edit-poster" x-show="editing" x-cloak @click.stop>
    <span class="muted">Portada</span>
    {% if movie.movie %}
    <form method="post" action="{% url 'secret:movie-poster-remove' movie.pk %}" class="inline-form">
        {% csrf_token %}
        <input type="hidden" name="scope" value="{{ scope }}">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="link-btn link-btn--danger">Quitar portada</button>
    </form>
    {% endif %}
    <input type="text" name="query" placeholder="Buscar película o serie para su portada..." autocomplete="off"
           hx-get="{% url 'secret:movie-poster-search' movie.pk %}?scope={{ scope }}"
           hx-trigger="keyup changed delay:400ms, search"
           hx-target="#poster-search-{{ movie.pk }}"
           hx-swap="innerHTML">
    <div id="poster-search-{{ movie.pk }}"></div>
</div>
{% if can_add %}
<form method="post" action="{% url 'secret:own-movie-delete' movie.pk %}" class="inline-form"
      onsubmit="return confirm('¿Quitar «{{ movie.title }}» de tu lista?');" @click.stop>
    {% csrf_token %}
    <button type="submit" class="link-btn link-btn--danger">🗑️ Quitar de mi lista</button>
</form>
{% endif %}
{% endif %}
