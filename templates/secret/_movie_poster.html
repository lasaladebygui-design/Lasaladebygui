<div class="secret-movie__poster-wrap">
    <a href="{% url 'secret:movie-detail' movie.pk %}" class="secret-movie__poster-link" @click.stop title="Ver ficha completa">
        {% if movie.poster_url %}
            <img src="{{ movie.poster_url }}" alt="" class="secret-movie__poster" loading="lazy" decoding="async">
        {% else %}
            <span class="secret-movie__poster secret-movie__poster--placeholder">🎬</span>
        {% endif %}
    </a>
    {% if movie.movie.is_tv %}
        {% if editable %}
        <button type="button"
                class="secret-movie__watch-badge secret-movie__watch-badge--{{ movie.series_watch_status|default:'not_watched' }}"
                title="{% if movie.series_watch_status == 'watched' %}Vista — clic para cambiar{% elif movie.series_watch_status == 'airing' %}En emisión — clic para cambiar{% else %}No vista — clic para cambiar{% endif %}"
                hx-post="{% url 'secret:movie-watch-cycle' movie.pk %}?scope={{ scope }}"
                hx-target="closest .secret-movie__poster-wrap"
                hx-swap="outerHTML"
                @click.stop
        ></button>
        {% else %}
        <span class="secret-movie__watch-badge secret-movie__watch-badge--{{ movie.series_watch_status|default:'not_watched' }}"
              title="{% if movie.series_watch_status == 'watched' %}Vista{% elif movie.series_watch_status == 'airing' %}En emisión{% else %}No vista{% endif %}"></span>
        {% endif %}
    {% endif %}
</div>
