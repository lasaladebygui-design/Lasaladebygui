{% if result %}
<div class="movie-card movie-card--result secret-result">
    {% if result.poster_url %}
        <img src="{{ result.poster_url }}" alt="" class="movie-card__poster">
    {% endif %}
    <div class="movie-card__body">
        <h3>#{{ result.number }} — {{ result.title }}</h3>
        <p class="muted">Nota personal: {{ result.personal_rating }}</p>
        {% if result.comment %}<p>{{ result.comment }}</p>{% endif %}
    </div>
</div>
{% endif %}
