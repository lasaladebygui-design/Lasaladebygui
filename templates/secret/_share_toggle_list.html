{% if member %}
<form method="post" action="{% url 'secret:own-list-share-kick' member.pk %}" class="inline-form"
      hx-post="{% url 'secret:own-list-share-kick' member.pk %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}<button type="submit" class="share-toggle share-toggle--on" title="Quitar acceso a tu lista">📋 Lista ✓</button>
</form>
{% else %}
<form method="post" action="{% url 'secret:own-list-share-invite' friend.username %}" class="inline-form"
      hx-post="{% url 'secret:own-list-share-invite' friend.username %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}<button type="submit" class="share-toggle" title="Compartir tu lista">📋 Lista</button>
</form>
{% endif %}
