{% if error %}
    <p class="field-errors">{{ error }}</p>
{% elif query and not results %}
    <p class="muted">Sin resultados para «{{ query }}».</p>
{% endif %}

{% if results %}
<ul class="own-add-grid">
    {% for movie in results %}
    <li class="own-add-card">
        <form method="post" action="{% url 'secret:own-movie-add' movie.media_type movie.tmdb_id %}">
            {% csrf_token %}
            <button type="submit" class="own-add-card__hit">
                <span class="own-add-card__poster-wrap">
                    {% if movie.poster_url %}<img src="{{ movie.poster_url }}" alt="" class="own-add-card__poster" loading="lazy">{% endif %}
                    <span class="own-add-card__badge">{% if movie.media_type == "tv" %}📺 Serie{% else %}🎬 Película{% endif %}</span>
                </span>
                <span class="own-add-card__body">
                    <span class="own-add-card__title">{{ movie.title }} <span class="muted">{{ movie.year }}</span></span>
                    <span class="own-add-card__cta">+ Elegir</span>
                </span>
            </button>
        </form>
    </li>
    {% endfor %}
</ul>
{% endif %}
