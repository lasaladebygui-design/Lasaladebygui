{% if error %}
    <p class="field-errors">{{ error }}</p>
{% elif query and not results %}
    <p class="muted">Sin resultados para «{{ query }}».</p>
{% endif %}

{% if results %}
<ul class="search-results">
    {% for movie in results %}
    <li class="search-result">
        {% if movie.poster_url %}
            <img src="{{ movie.poster_url }}" alt="" class="search-result__poster">
        {% endif %}
        <div class="search-result__body">
            <strong>{{ movie.title }}</strong> <span class="muted">{{ movie.year }}</span>
        </div>
        <form method="post" action="{% url 'secret:own-movie-add' movie.tmdb_id %}" class="own-add-form">
            {% csrf_token %}
            <label class="own-add-form__field">
                <span class="muted">Nota</span>
                <input type="number" name="personal_rating" step="0.1" min="1" max="10" value="5" required>
            </label>
            <label class="own-add-form__field own-add-form__field--grow">
                <span class="muted">Comentario</span>
                <input type="text" name="comment" placeholder="Opcional...">
            </label>
            <button type="submit" class="btn btn--accent btn--sm">+ Añadir a mi lista</button>
        </form>
    </li>
    {% endfor %}
</ul>
{% endif %}
