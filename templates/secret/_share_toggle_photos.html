{% if member %}
<form method="post" action="{% url 'secret:photo-board-kick' member.pk %}" class="inline-form"
      hx-post="{% url 'secret:photo-board-kick' member.pk %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}<button type="submit" class="share-toggle share-toggle--on" title="Quitar acceso a tu tablón">🎞️ Tablón ✓</button>
</form>
{% else %}
<form method="post" action="{% url 'secret:photo-board-invite' friend.username %}" class="inline-form"
      hx-post="{% url 'secret:photo-board-invite' friend.username %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}<button type="submit" class="share-toggle" title="Compartir tu tablón">🎞️ Tablón</button>
</form>
{% endif %}
