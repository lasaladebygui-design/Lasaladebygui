{% if user.is_authenticated and scope != "own" %}

        {% if scope == "bygui" %}🕶️ La lista de Admin{% else %}👥 La lista de {{ list_owner }}{% endif %}
        {% if not editable %}· solo lectura{% endif %}
    </span>
    <a href="?scope=own" class="link-btn"
       hx-get="?scope=own" hx-select="#ts-content" hx-target="#ts-content" hx-swap="outerHTML" hx-push-url="true"
       hx-headers='{"HX-Shell-Nav": "1"}'>← Volver a la tuya</a>
</div>
{% endif %}
