{% if can_add %}
<div class="secret-add-movie" x-data="{ open: false }">
    <button type="button" class="btn btn--accent" @click="open = !open" x-text="open ? 'Cerrar buscador' : '+ Añadir película o serie a mi lista'"></button>
    <div x-show="open" x-cloak x-transition class="secret-add-movie__panel">
        <input type="text" name="query" placeholder="Buscar película o serie..." autocomplete="off"
               hx-get="{% url 'secret:own-movie-add-search' %}"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#own-add-results"
               hx-swap="innerHTML">
        <div id="own-add-results"></div>
    </div>
</div>
{% endif %}
