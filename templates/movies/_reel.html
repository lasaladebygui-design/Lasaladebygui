{% if reel_json %}
<div class="slot-machine" x-data='slotSpin({{ reel_json|safe }})' x-init="init()">
    <div class="slot-machine__lights">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="slot-machine__reels">
        <template x-for="(posters, r) in reels" :key="r">
            <div class="slot-reel" :class="{ 'slot-reel--spinning': spinning[r] }">
                <template x-for="(poster, i) in posters" :key="i">
                    <img :src="poster || ''" x-show="indices[r] === i" x-cloak class="slot-reel__poster" alt="">
                </template>
            </div>
        </template>
        <div class="slot-machine__payline"></div>
    </div>

    <div x-show="allStopped" x-cloak x-transition class="roulette-result">
        <div class="movie-card movie-card--result">
            {% if result.poster_url %}
                <img src="{{ result.poster_url }}" alt="" class="movie-card__poster" loading="lazy" decoding="async">
            {% endif %}
            <div class="movie-card__body">
                <h3><a href="{% url 'movies:detail' result.pk %}">{{ result.title }}</a></h3>
                <p class="muted">{{ result.year }}{% if result.imdb_rating %} · IMDb {{ result.imdb_rating }}{% endif %}</p>
                <p>{{ result.overview|truncatewords:25 }}</p>
                <div class="roulette-result__actions">
                    <a href="{% url 'movies:detail' result.pk %}" class="btn btn--accent">Ver ficha</a>
                    <span class="muted roulette-result__hint">o gira otra vez arriba ↑</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
