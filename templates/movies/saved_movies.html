{% extends "base.html" %}

{% block title %}Guardadas{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap">
        <div class="section-header">
            <div>
                <span class="card__tag">Tu cuenta</span>
                <h1>Guardadas</h1>
            </div>
            <div class="section-header__actions">
                <a href="{% url 'movies:saved-movies-share-image' %}" download="guardadas_{{ user.username }}.png" class="btn btn--ghost btn--sm" title="Descarga una imagen de Guardadas agrupada por listas">📤 Compartir</a>
                <a href="{% url 'movies:roulette-list' %}{% if list_param %}?list={{ list_param }}{% endif %}" class="btn btn--accent">Girar la ruleta</a>
                <a href="{% url 'movies:list' %}" class="btn btn--ghost">Volver al catálogo</a>
            </div>
        </div>

        {% include "movies/_saved_movies_body.html" with next_url=request.get_full_path %}
    </div>
</section>
{% endblock %}
